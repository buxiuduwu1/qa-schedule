function toggleAll(){document.querySelectorAll(".accordion-group").forEach(function(g){g.classList.toggle("open")})}
function toggleFilter(btn,status){activeFilters[status]=!activeFilters[status];if(activeFilters[status]){btn.classList.remove("off");btn.classList.add("active")}else{btn.classList.remove("active");btn.classList.add("off")}filterAll()}
function filterAll(){var q=(document.getElementById("search").value||"").toLowerCase();document.querySelectorAll(".accordion-group").forEach(function(group){var visible=0;group.querySelectorAll("tbody tr").forEach(function(row){var ok=activeFilters[row.dataset.status]&&(!q||row.textContent.toLowerCase().indexOf(q)>=0);if(ok){row.classList.remove("hidden");visible++}else{row.classList.add("hidden")}});if(visible===0){group.classList.add("hidden")}else{group.classList.remove("hidden")}})}
