const INACTIVE = [];

const STATUS_ORDER = ['新','设计取消','已提测','测试中','挂起'];
const TAG_CLASS = {'新':'tag-new','设计取消':'tag-cancelled','已提测':'tag-submitted','测试中':'tag-testing','挂起':'tag-suspended'};
const BADGE_CLASS = {'新':'badge-new','设计取消':'badge-cancelled','已提测':'badge-submitted','测试中':'badge-testing','挂起':'badge-suspended'};

let activeFilter = 'all';

function renderSummary() {
  const tbody = document.getElementById('summaryBody');
  tbody.innerHTML = DEVROWS.map(d => {
    let rowClass = '';
    if (d.total >= 10) rowClass = 'row-hot';
    else if (d.total >= 7) rowClass = 'row-warm';
    const badges = STATUS_ORDER.map(st => {
      const n = d[st] || 0;
      if (n === 0) return '<td></td>';
      return `<td><span class="badge ${BADGE_CLASS[st]}">${n}</span></td>`;
    }).join('');
    return `<tr class="${rowClass}">
      <td><strong>${d.name}</strong></td>
      <td><strong>${d.total}</strong></td>
      ${badges}
    </tr>`;
  }).join('');
}

function renderAccordion() {
  const container = document.getElementById('accordion');
  const searchTerm = document.getElementById('search').value.toLowerCase();

  let html = '';
  DATA.forEach(group => {
    const filtered = group.items.filter(item => {
      const matchSearch = !searchTerm || item.title.toLowerCase().includes(searchTerm);
      const matchStatus = activeFilter === 'all' || item.status === activeFilter;
      return matchSearch && matchStatus;
    });
    if (filtered.length === 0 && activeFilter !== 'all') return;

    const statBadges = STATUS_ORDER.map(st => {
      const n = group.stats[st] || 0;
      if (n === 0) return '';
      return `<span class="badge ${BADGE_CLASS[st]}" style="font-size:11px;">${n}</span>`;
    }).filter(Boolean).join('');

    html += `<div class="acc-group" data-dev="${group.name}">
      <div class="acc-header" onclick="toggleAccordion(this)">
        <h3>${group.name}</h3>
        <div class="acc-badges">${statBadges}</div>
        <span class="acc-total">${group.total}条</span>
        <span class="acc-arrow">▶</span>
      </div>
      <div class="acc-body">
        ${filtered.map(item => `
          <div class="acc-item">
            <span class="st-tag ${TAG_CLASS[item.status]}">${item.status}</span>
            <a class="st-link" href="${item.url}" target="_blank" title="${item.title.replace(/"/g,'&quot;')}">${item.title}</a>
            <span class="st-meta">${item.created}</span>
          </div>
        `).join('')}
      </div>
    </div>`;
  });

  container.innerHTML = html;
  document.getElementById('noResults').classList.toggle('hidden', !!container.innerHTML.trim());
}

function toggleAccordion(header) {
  header.parentElement.classList.toggle('open');
}

function toggleFilter(btn, status) {
  document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeFilter = status;
  filterAll();
}

function filterAll() {
  renderAccordion();
}

function toggleAll() {
  const groups = document.querySelectorAll('.acc-group');
  const allOpen = Array.from(groups).every(g => g.classList.contains('open'));
  groups.forEach(g => g.classList.toggle('open', !allOpen));
  document.querySelector('.toggle-all').textContent = allOpen ? '📂 展开全部' : '📁 折叠全部';
}

// Initial render
renderSummary();
renderAccordion();
</script>
