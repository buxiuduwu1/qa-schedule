name: Refresh QA Schedule

on:
  schedule:
    # 每周一 12:00 (UTC+8) = 每周一 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:  # 手动触发：仓库 Actions 页 → Run workflow
  push:
    branches: [main]
    paths:
      - 'scripts/refresh_qa_schedule.py'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run refresh script
        env:
          TAPD_TOKEN: ${{ secrets.TAPD_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python scripts/refresh_qa_schedule.py

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy . --project-name qa-schedule --branch main
